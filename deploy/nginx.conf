# Nginx 反向代理配置示例
# 放置路径：/etc/nginx/conf.d/dmk-progress.conf （CentOS/Anolis）
#        或 /etc/nginx/sites-available/dmk-progress 并软链到 sites-enabled （Ubuntu）
# 修改 server_name 为您的域名或服务器公网IP，然后：nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;   # 改为您的域名；暂用IP则填服务器公网IP

    client_max_body_size 50m;      # 与后端 bodyLimit 一致（现场照片上传）

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 供后端判断 HTTP/HTTPS 设置Cookie
        proxy_read_timeout 60s;
    }
}

